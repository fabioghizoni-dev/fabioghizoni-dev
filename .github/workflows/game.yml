name: Ship Game

on:
  workflow_dispatch:

jobs:
  game:
    name: Destruir Commits com Nave 2D
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v4

      - name: 🎮 Iniciando o jogo
        run: |
          echo ""
          echo "=============================="
          echo "     GITHUB COMMIT BLASTER"
          echo "=============================="
          sleep 1

          echo "🔎 Carregando últimos commits..."
          echo ""
          git log --oneline -n 5 > commits.txt

          i=1
          while read line; do
            hash=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)

            echo "🎯 Alvo ${i}: [$hash] $msg"
            sleep 1

            echo ""
            echo "🚀 Nave se aproximando..."
            sleep 1

            # Desenha nave e simula tiro
            echo "            ↑"
            echo "            |"
            echo "           /_\\"
            echo "          | O |     ← Nave"
            echo "         /|___|\\"
            echo "          / | \\"
            echo "         🚀 FIRE!"
            sleep 1

            # Simula tiro chegando
            for d in 1 2 3 4 5; do
              echo "            |"
              sleep 0.2
            done

            echo "          💥 HIT: [$msg]"
            echo "          ❌ Commit destruído"
            echo ""
            echo "-----------------------------"
            sleep 1
            i=$((i+1))
          done < commits.txt

          echo ""
          echo "🏁 Fim da missão! Todos os commits foram neutralizados com sucesso. 😎"
